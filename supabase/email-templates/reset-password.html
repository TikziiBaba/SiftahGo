<!doctype html>
<html lang="tr">
<body style="margin:0;background:#f3f4f6;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<div style="max-width:520px;margin:0 auto;padding:24px 16px">
<div style="background:#ffffff;border-radius:16px;padding:28px 24px">
<p style="margin:0 0 16px;font-weight:800;color:#0f766e">SiftahGo</p>
<h1 style="margin:0 0 8px;font-size:20px;color:#111827">Şifrenizi yenileyin</h1>
<p style="margin:0 0 20px;color:#374151;line-height:1.5">Şifre sıfırlama isteği aldık. Yeni şifrenizi belirlemek için aşağıdaki düğmeye dokunun.</p>
<p style="margin:24px 0 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&redirect_to={{ .RedirectTo }}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:999px">Yeni şifre belirle</a></p>
<p style="margin:24px 0 0;color:#6b7280;font-size:13px;line-height:1.5">Bu isteği siz yapmadıysanız bu e-postayı yok sayın; şifreniz değişmez.</p>
</div>
<p style="margin:16px 0 0;text-align:center;font-size:12px;color:#9ca3af">Bu e-posta SiftahGo hesabınız için gönderildi.</p>
</div>
</body>
</html>
